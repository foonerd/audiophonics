[package]
name = "audiophonics-remote"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The Audiophonics infrared handset, read from the kernel's own decoder"

[dependencies]
audiophonics-base = { path = "../base" }
serde_json.workspace = true
# One ioctl: the request that sets the receiver's device to hand over
# decoded frames.
libc = "0.2"

# As the workspace's, but for the one function in src/reader.rs that makes
# that ioctl: deny, with the exception written where it is made.
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
