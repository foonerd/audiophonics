[package]
name = "audiophonics-meters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Level meters for a display: what the audio tap measured, read from its ring, and given the movement of a meter"

[dependencies]
# What the audio tap measured is read from its ring with the tap's own
# reader, from the Glass repository where evotap is built; the ring's
# layout is a contract between the two.
tap = { git = "https://github.com/foonerd/glass", tag = "v0.11.47" }

[lints]
workspace = true
