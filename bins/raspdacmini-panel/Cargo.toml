[package]
name = "raspdacmini-panel"
version = "1.99.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The RaspDac Mini's display and its remote: a 320x240 ILI9341 LCD drawn from Volumio's state, with the cover of what plays"

[dependencies]
audiophonics-base = { path = "../../crates/base" }
# The meters: the tap's levels and a meter's movement.
audiophonics-meters = { path = "../../crates/meters" }
audiophonics-player = { path = "../../crates/player" }
audiophonics-remote = { path = "../../crates/remote" }
audiophonics-unifont = { path = "../../crates/unifont" }
audiophonics-wire = { path = "../../crates/wire" }
# The drawing model: a DrawTarget over the frame, and its primitives.
embedded-graphics = "0.8"
# Outline fonts, rasterised without a C library. Its SIMD paths are left
# out: the same glyph must come out the same on the ARM the players run
# and on the machine that checks the screens.
fontdue = { version = "0.9", default-features = false, features = ["std", "hashbrown"] }
# Covers: JPEG, PNG, GIF, WebP and BMP, decoded without a C library.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
# Volumio's own source icons are SVG. Drawn without system fonts: an icon
# has no text.
resvg = { version = "0.48", default-features = false }
# The panel: spidev for the bus, two GPIO lines for D/C and reset. The
# controller's start-up is thirty lines of commands, which are in
# src/ili9341.rs where they can be read.
spidev = "0.7"
gpio-cdev = "0.6"
# The panel as a framebuffer: its memory, mapped.
memmap2 = "0.9"
signal-hook = { version = "0.3", default-features = false }
serde_json.workspace = true

[dev-dependencies]
audiophonics-unifont = { path = "../../crates/unifont", features = ["sample"] }

# As the workspace's, but for the one function in src/fbdev.rs that maps
# the framebuffer's memory: deny, with the exception written where it is
# made.
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
