# What the release tooling needs to know about this plugin: the crate whose
# binary it ships and whose version it carries.
CRATE=raspdacmini-panel
# What it ships from another release: components/<name>.lock.
COMPONENTS="evotap"
# The languages its settings page is in beside the set every plugin here
# carries: the ones version 1 of the plugin had and that set has not.
MORE_LANGUAGES="cs da fi hu sv"
