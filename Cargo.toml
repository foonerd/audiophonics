[workspace]
resolver = "2"
members = [
    "crates/base",
    "crates/meters",
    "crates/player",
    "crates/remote",
    "crates/unifont",
    "crates/wire",
    "bins/evosabre-panel",
    "bins/raspdacmini-panel",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/foonerd/audiophonics"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The daemons are small, start once and run for months: size first.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# One set of lints for every crate; CI denies warnings.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
